setting : 
  seed : 2000
  os_environ:
    WANDB_API_KEY: ~
    WANDB_RUN_ID: ~
    CUDA_VISIBLE_DEVICES : 0
    device : "cuda"
  wandb_config: 
    project : LLMProject
    name : Qwen3_base


model : 
  vocab_size : 151936
  emb_dim : 1024
  n_heads : 16
  n_layers : 1 #28
  hidden_dim : 3072
  head_dim : 128
  qk_norm : True
  n_kv_groups : 8
  rope_base : 1000000
  dtype : bfloat16
  context_length : 512 #2048
#model to use : 
  # model_by_path : model/Qwen_modelc
  kwargs: 
  #initialization arguments 
  config_path : 
  load_pretrained : False

training :
  generate_sample:
    start_context : "Where is new york?"
  load_checkpoint : ./checkpoints/last-v1.ckpt

# le
  lr_scheduler_kwargs: 
    type_lr : cosine 
    init_lr: 6.0e-4
    min_lr : 6e-5
    warmup_steps : 2000
    total_steps : 50000

  optimizer_kwargs: 
    type : AdamW
    betas : [0.9,0.95]
    weight_decay : 0.1
    grad_clip : 1.0

  # save_path : weights/


dataset : 
  dataset_by_path : the-verdict.txt
  train_bin_path : data/openweb/train.bin
  val_bin_path : data/openweb/val.bin
  dataloader_kwargs : 
    batch_size : 8
    num_workers: 0
    max_length : 128
    stride : 128

  # train_data : 
  # valid_data : 
  # test_data : 

  # kwargs : 
    tokenizer: 

Trainer : 
  # max_epochs: 2
  max_steps : 5000
  log_every_n_steps: 1
  val_check_interval: 200
  limit_val_batches : 20
  logger : True
  enable_checkpointing: True
  default_root_dir: ./checkpoints/
  devices : 1
  accumulate_grad_batches : 8
  precision : 32

  checkpoint : 
    monitor : val_loss
    mode: min
    save_top_k : 3
    save_last: True
  callbacks: 
    early_stopping : 
      monitor : val_loss
      patience : 3
      mode : min





    