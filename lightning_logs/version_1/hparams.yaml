config:
  setting:
    seed: 2000
    os_environ:
      WANDB_API_KEY: null
      WANDB_RUN_ID: null
      CUDA_VISIBLE_DEVICES: 0
      device: cuda
    wandb_config:
      project: LLMProject
      name: Qwen3_base
  model:
    vocab_size: 151936
    emb_dim: 1024
    n_heads: 16
    n_layers: 1
    hidden_dim: 3072
    head_dim: 128
    qk_norm: true
    n_kv_groups: 8
    rope_base: 1000000
    dtype: float32
    context_length: 128
    model_by_path: model/Qwen_model
    kwargs: null
    config_path: null
    load_pretrained: false
  training:
    generate_sample:
      start_context: Quelle est la capitale du cameroun?
    lr_scheduler_kwargs:
      type_lr: cosine
      init_lr: 0.0002
      warmup_steps: 1000
      total_steps: 50000
    optimizer_kwargs:
      type: AdamW
      betas:
      - 0.9
      - 0.95
      weight_decay: 0.01
    save_path: weights/
  dataset:
    dataset_by_path: the-verdict.txt
    dataloader_kwargs:
      batch_size: 8
      num_workers: 0
      max_length: 128
      stride: 128
      tokenizer: null
  Trainer:
    max_epochs: 2
    log_every_n_steps: 1
    val_check_interval: 0.5
    logger: true
    enable_checkpointing: true
    default_root_dir: ./checkpoints/
    save_top_k: 3
    monitor: val_loss
    devices: 1
    accumulate_grad_batches: 8
    precision: 32
    callbacks:
      early_stopping:
        monitor: val_loss
        patience: 3
        mode: min
